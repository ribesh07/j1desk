name: Deploy to Google Play

on:
  # Push a tag like v1.0.1 to release to the internal track
  push:
    tags:
      - "v*"
  # Or run it by hand from the Actions tab and pick the track
  workflow_dispatch:
    inputs:
      track:
        description: "Play Console track"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: "Release status (use 'draft' until the app has been published once)"
        required: true
        default: completed
        type: choice
        options: [completed, draft]

concurrency:
  group: deploy-playstore
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PACKAGE_NAME: org.j1soft.tickets
      # versionCode = run number + offset (raise BUILD_NUMBER_OFFSET if Play says the code is already used)
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compute version code
        run: |
          OFFSET="${{ vars.BUILD_NUMBER_OFFSET }}"
          echo "VERSION_CODE=$(( ${OFFSET:-0} + BUILD_NUMBER ))" >> "$GITHUB_ENV"

      # .env is bundled as an asset, so it must exist at build time
      - name: Create .env
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          if [ -n "$DOT_ENV" ]; then
            printf '%s\n' "$DOT_ENV" > .env
          else
            echo "::warning::DOT_ENV secret not set, building with .env.example defaults"
            cp .env.example .env
          fi

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build app bundle
        run: flutter build appbundle --release --build-number="$VERSION_CODE"

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_CODE }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}

      - name: Clean up signing files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks .env
