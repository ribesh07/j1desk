# App icon (same logo as the web app). Regenerate with: dart run flutter_launcher_icons
# Source images are in assets/icon/ (1024x1024). Play Store listing icon: store/playstore-icon-512.png
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"          # full icon: iOS + older Android
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#0d1117"         # GitHub dark background
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"  # Android 13+ themed icons
  ios: true
  remove_alpha_ios: true                      # App Store rejects icons with transparency
